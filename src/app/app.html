<div class="container mb-3">
  <app-header></app-header>
  <div class="row">
    <div class="col-lg-3">
      <div class="item">
        @for(user of users;track user.id){
        <app-user [user]="user" (click)="updateSelectedUser(user)"
          [isSelected]="selectedUser?.id === user.id"></app-user>
        }
      </div>
    </div>
    <div class="col-lg-9">
      <div class="item">
        @if(selectedUser){
        <app-tasks [user]="selectedUser"></app-tasks>
        }@else {
        <p>Select a user to see their tasks!</p>
        }
      </div>
    </div>
  </div>
</div>
