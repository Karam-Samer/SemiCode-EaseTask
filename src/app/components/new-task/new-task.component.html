<div class="popup">
    <div class="box" (click)="$event.stopPropagation()">
        <div class="head">
            <h3>Add Task</h3>
        </div>
        <div class="body">
            <form #Form="ngForm" ngForm (submit)="addTask(Form)">
                <div class="mb-3">
                    <label for="Title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="Title" name="title" #title="ngModel" ngModel required>
                    @if((title.dirty && title.invalid) && title.getError('required')){
                    <p class="alert alert-danger mt-2">Title is required.</p>
                    }
                </div>
                <div class="mb-3">
                    <label for="Summary" class="form-label">Summary</label>
                    <textarea class="form-control" id="Summary" name="summary" rows="3" #summary="ngModel" ngModel required></textarea>
                    @if((summary.dirty && summary.invalid) && summary.getError('required')){
                    <p class="alert alert-danger mt-2">Summary is required.</p>
                    }
                </div>
                <div class="mb-3">
                    <label for="Date" class="form-label">Date</label>
                    <input type="date" class="form-control" id="Date" name="date" #date="ngModel" ngModel required>
                    @if((date.dirty && date.invalid) && date.getError('required')){
                    <p class="alert alert-danger mt-2">Date is required.</p>
                    }
                </div>
                <div class="mb-3 d-flex justify-content-end align-items-center">
                    <button class="btn btn-secondary me-2" (click)="onClosePopup(); $event.preventDefault()">Cancel</button>
                    <button class="btn btn-success">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>
